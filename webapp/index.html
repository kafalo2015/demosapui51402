<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!--
        HISTORIQUE VERSION:
        25/02/2026 LOT 16 V2 Appel HTTPS

        ANO Chargement resources 22-04-2026 
        24/04/2026 -> Le chargemnet de la librairie avec le UI5 Tooling SAPUI5 est cassé
        src="resources/sap-ui-core.js"

        AMELIORATION GEMINI [Pointer sur la version CDN déclarée dans le manifest 1.120]
        https://ui5.sap.com/1.120.12/resources/sap-ui-core.js  au lieu de
        https://sdk.openui5.org/resources/sap-ui-core.js  
    -->


    <title>30/04/2026 LOT 20/21 V2 librairie à partir du CDN SAP </title>
    <style>
        html, body, body > div, #container, #container-uiarea {
            height: 100%;
        }
    </style>
    <script
        id="sap-ui-bootstrap"
        src="https://ui5.sap.com/1.120/resources/sap-ui-core.js"                           
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-resource-roots='{
            "clf.logistique.chargementquais": "./"
        }'
        data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
        data-sap-ui-compat-version="edge"
        data-sap-ui-async="true"
        data-sap-ui-frame-options="trusted"
    ></script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
    <div
        data-sap-ui-component
        data-name="clf.logistique.chargementquais"
        data-id="container"
        data-settings='{"id" : "clf.logistique.chargementquais"}'
        data-handle-validation="true"
    ></div>
</body>
</html>
