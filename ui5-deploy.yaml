# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: clf.logistique.ZUI5_CHARGQUAIS
type: application
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
      configuration:
        debug: true
        transformModulesToUI5:
          overridesToOverride: true
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        log: 5
        ignoreCertError: true
        strictSsl: false
        allowSelfSigned: true
        target:
          url: https://sapdev.exaclair.eu/
          client: '010'          
        app:
          name: ZUI5_CHARGQUAIS  
          description: Application UI5 chargement des quais
          package: Z_CF_DEMO
          transport: DEVK916802
      exclude:
        - /test/
  resources:
    excludes:
      - /test/**
      - /localService/**
